name: Run CI Tests

on:
  pull_request:
    paths-ignore:
      - 'build/**'
      - 'examples/**'
      - 'scripts/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'Vagrantfile'
  push:
    branches:
      - main
    paths-ignore:
      - 'build/**'
      - 'examples/**'
      - 'scripts/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'Vagrantfile'

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: hashicorp/setup-golang@v3
    - name: Machine Setup
      run: sudo .github/machinesetup.sh
    - name: Make Setup
      run: |
        make deps
        make check
        make dev
    - name: Make test
      run: sudo -E env "PATH=$PATH" make test-ci
